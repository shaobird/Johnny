name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Lint, syntax, deps, security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Ruff lint
        run: ruff check .

      - name: pip-audit (dependency CVEs)
        run: pip-audit --strict --ignore-vuln GHSA-4xh5-x5gv-qwph || true
        # `|| true` keeps audit advisory only — flip to fail the build by removing it
        # once you've triaged the current set of advisories.

  notify-on-failure:
    name: Telegram notify on failure
    runs-on: ubuntu-latest
    needs: check
    if: failure()
    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets not set; skipping notification."
            exit 0
          fi
          MSG=$'\xE2\x9D\x8C CI failed on '"${GITHUB_REPOSITORY}"$'\n'"branch: ${GITHUB_REF_NAME}"$'\n'"commit: ${GITHUB_SHA::7} by ${GITHUB_ACTOR}"$'\n'"run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true"
